[build-system]
requires = ["setuptools", "wheel", "setuptools_scm"]  # Build requirements
build-backend = "setuptools.build_meta"

[project]
name = "inflation_forecast"
version = "0.1.0"
description = "this package provides function/classes needed for inflation forecasting project"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Yuhao Huo", email = "martinyuhaohuo@gmail.com" }
]
keywords = ["machine learning", "prediction"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]

# Runtime dependencies, can also specifiy outside package version here
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "torch", 
    "torchvision"
]

[tool.setuptools.packages.find]
where = ["."] # search for package in the project root
